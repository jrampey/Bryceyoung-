name: Update NFL QB Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-nfl-data.yml"

permissions:
  contents: write

concurrency:
  group: nfl-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and prepare QB data
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          out=Path("data")
          out.mkdir(exist_ok=True)
          current=datetime.now().year

          for year in range(2023,current+1):
              for kind in ("reg","post"):
                  url=f"https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_{kind}_{year}.csv"
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          text=r.read().decode("utf-8")
                      rows=[r for r in csv.DictReader(io.StringIO(text)) if r.get("position")=="QB"]
                      payload={"season":year,"type":kind.upper(),"updated_at":datetime.now(timezone.utc).isoformat(),"players":rows}
                      (out/f"qbs_{kind}_{year}.json").write_text(json.dumps(payload,separators=(",",":")),encoding="utf-8")
                      print(year,kind,len(rows))
                  except Exception as e:
                      print(f"Skipping {year} {kind}: {e}")
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update NFL QB statistics"
          git push
