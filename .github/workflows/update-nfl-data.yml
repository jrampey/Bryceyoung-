name: Update NFL QB Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-nfl-data.yml"

permissions:
  contents: write

concurrency:
  group: nfl-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch nflverse QB statistics
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          HEADERS={"User-Agent":"BryceYoungTracker/1.0"}
          out=Path("data"); out.mkdir(exist_ok=True)
          current=datetime.now().year

          def fetch(url):
              req=urllib.request.Request(url,headers=HEADERS)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read().decode("utf-8-sig")

          def n(v):
              try: return float(v or 0)
              except: return 0

          for year in range(2023,current+1):
              for kind in ("reg","post"):
                  url=f"https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_{kind}_{year}.csv"
                  try:
                      rows=list(csv.DictReader(io.StringIO(fetch(url))))
                  except Exception as e:
                      print("skip",year,kind,e); continue
                  players=[]
                  for r in rows:
                      if (r.get("position") or "").upper()!="QB": continue
                      players.append({
                        "player_id":r.get("player_id",""),"player_display_name":r.get("player_display_name") or r.get("player_name") or "Unknown",
                        "team":r.get("recent_team") or r.get("team") or "—","position":"QB",
                        "games":n(r.get("games")),"completions":n(r.get("completions")),"attempts":n(r.get("attempts")),
                        "passing_yards":n(r.get("passing_yards")),"passing_tds":n(r.get("passing_tds")),"interceptions":n(r.get("interceptions")),
                        "sacks":n(r.get("sacks")),"sack_yards":n(r.get("sack_yards")),"passing_air_yards":n(r.get("passing_air_yards")),
                        "passing_yards_after_catch":n(r.get("passing_yards_after_catch")),"passing_first_downs":n(r.get("passing_first_downs")),
                        "passing_epa":n(r.get("passing_epa")),"passing_2pt_conversions":n(r.get("passing_2pt_conversions")),
                        "carries":n(r.get("carries")),"rushing_yards":n(r.get("rushing_yards")),"rushing_tds":n(r.get("rushing_tds")),
                        "rushing_first_downs":n(r.get("rushing_first_downs")),"rushing_epa":n(r.get("rushing_epa")),
                        "rushing_2pt_conversions":n(r.get("rushing_2pt_conversions")),"fantasy_points":n(r.get("fantasy_points")),
                        "fantasy_points_ppr":n(r.get("fantasy_points_ppr"))
                      })
                  players.sort(key=lambda x:x["passing_yards"],reverse=True)
                  payload={"season":year,"type":kind.upper(),"updated_at":datetime.now(timezone.utc).isoformat(),"source":"nflverse","players":players}
                  (out/f"qbs_{kind}_{year}.json").write_text(json.dumps(payload,separators=(",",":")),encoding="utf-8")
                  print(year,kind,len(players),"QBs")
          PY
      - name: Commit NFL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update nflverse QB statistics"
          git pull --rebase origin main
          git push origin HEAD:main
