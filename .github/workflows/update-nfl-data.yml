name: Update ESPN QB Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-nfl-data.yml"

permissions:
  contents: write

concurrency:
  group: nfl-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ESPN NFL quarterback statistics
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          HEADERS={"User-Agent":"Mozilla/5.0"}
          out=Path("data"); out.mkdir(exist_ok=True)
          current=datetime.now().year

          def get(url):
              req=urllib.request.Request(url,headers=HEADERS)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)

          for year in range(2023,current+1):
              for kind,stype in (("reg",2),("post",3)):
                  url=("https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/"
                       "statistics/byathlete?"+urllib.parse.urlencode({
                         "season":year,"seasontype":stype,"category":0,"limit":200
                       }))
                  try:
                      raw=get(url)
                      athletes=raw.get("athletes") or raw.get("items") or raw.get("statistics") or []
                      payload={"season":year,"type":kind.upper(),"updated_at":datetime.now(timezone.utc).isoformat(),
                               "source":"ESPN","raw":raw}
                      (out/f"espn_qbs_{kind}_{year}.json").write_text(json.dumps(payload,separators=(",",":")),encoding="utf-8")
                      print("ESPN",year,kind,"saved")
                  except Exception as e:
                      print("FAILED",year,kind,e)
                      raise
          PY
      - name: Commit ESPN data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update ESPN NFL QB statistics"
          git push
